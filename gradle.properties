org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false

# Retain the existing Kotlin plugin and legacy variant integrations on AGP 9.
android.builtInKotlin=false
android.newDsl=false

# Keep the intentional final resource IDs plus the aapt2 resource-name collapse; AGP 9's
# optimized resource shrinking rejects final IDs, so use the documented opt-out.
android.r8.optimizedResourceShrinking=false
